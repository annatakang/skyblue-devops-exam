stages:
  - validate
  - build
  - test
  - publish
  - deploy_dev
  - deploy_qa
  - deploy_staging
  - deploy_prod

default:
  tags:
    - skyblue-shell

variables:
  IMAGE_PREFIX: "annatakang77/skyblue"

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

build_images:
  stage: build
  script:
    - |
      set -eu
      for service in gateway users orders; do
        docker build --pull \
          -t "${IMAGE_PREFIX}-${service}:${CI_COMMIT_SHA}" \
          "./${service}"
      done

test_imports:
  stage: test
  script:
    - |
      set -eu
      docker run --rm \
        -e SECRET_KEY=ci-import-check-only \
        -e USERS_SERVICE_URL=http://skyblue-users:8000 \
        -e ORDERS_SERVICE_URL=http://skyblue-orders:8000 \
        "${IMAGE_PREFIX}-gateway:${CI_COMMIT_SHA}" \
        python -c 'from main import app; print("Gateway import OK")'

      for service in users orders; do
        docker run --rm \
          "${IMAGE_PREFIX}-${service}:${CI_COMMIT_SHA}" \
          python -c 'from main import app; print("Application import OK")'
      done

publish_images:
  stage: publish
  script:
    - |
      set -eu
      : "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in GitLab}"
      : "${DOCKERHUB_TOKEN:?Set DOCKERHUB_TOKEN in GitLab}"

      export DOCKER_CONFIG
      DOCKER_CONFIG="$(mktemp -d)"
      trap 'rm -rf "$DOCKER_CONFIG"' EXIT

      printf '%s' "$DOCKERHUB_TOKEN" |
        docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      for service in gateway users orders; do
        docker push "${IMAGE_PREFIX}-${service}:${CI_COMMIT_SHA}"
      done

validate_chart:
  stage: validate
  script:
    - helm lint helm/skyblue --set-string image.tag="$CI_COMMIT_SHA"
    - helm template skyblue helm/skyblue --namespace dev --set-string image.tag="$CI_COMMIT_SHA" > /dev/null

deploy_dev:
  stage: deploy_dev
  environment:
    name: dev
  resource_group: skyblue-dev
  script:
    - ./scripts/deploy.sh dev

deploy_qa:
  stage: deploy_qa
  environment:
    name: qa
  resource_group: skyblue-qa
  script:
    - ./scripts/deploy.sh qa

deploy_staging:
  stage: deploy_staging
  environment:
    name: staging
  resource_group: skyblue-staging
  script:
    - ./scripts/deploy.sh staging

deploy_prod:
  stage: deploy_prod
  environment:
    name: prod
  resource_group: skyblue-prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false
    - when: never
  script:
    - ./scripts/deploy.sh prod

unit_tests:
  stage: test
  script:
    - mkdir -p reports
    - |
      docker run --rm \
        -v "$CI_PROJECT_DIR/tests/unit:/tests:ro" \
        -v "$CI_PROJECT_DIR/reports:/reports" \
        -e PYTHONPATH=/app \
        "${IMAGE_PREFIX}-users:${CI_COMMIT_SHA}" \
        sh -ec 'pip install --no-cache-dir pytest==7.4.4 && python -m pytest /tests -v --junitxml=/reports/unit-tests.xml'
  artifacts:
    when: always
    reports:
      junit: reports/unit-tests.xml
    paths:
      - reports/unit-tests.xml
